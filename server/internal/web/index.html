<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2T4 Admin</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-radius: 9999px;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .device-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .device-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .device-card:hover {
            background: var(--border);
        }

        .device-card.selected {
            border: 2px solid var(--accent);
        }

        .device-info h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .device-info p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .device-stats {
            display: flex;
            gap: 16px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .file-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .file-preview {
            aspect-ratio: 16/9;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .file-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-preview audio {
            width: 100%;
            padding: 16px;
        }

        .file-info {
            padding: 12px;
        }

        .file-info h4 {
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-info p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .tab:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--accent);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            display: flex;
            justify-content: center;
            padding: 48px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 8px;
        }

        .modal-content audio {
            width: 100%;
            margin-top: 16px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.25rem;
        }

        .plugin-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }

        .plugin-card.disabled {
            opacity: 0.6;
        }

        .plugin-card.error {
            border-color: var(--danger);
        }

        .plugin-meta h3 {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plugin-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .plugin-actions {
            display: flex;
            gap: 8px;
        }

        .plugin-logs {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 12px;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            font-size: 0.8rem;
            white-space: pre-wrap;
            border: 1px solid var(--border);
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .log-time {
            color: #888;
            margin-right: 8px;
        }

        .log-type {
            font-weight: bold;
            margin-right: 8px;
            color: #fff;
        }

        .log-content {
            color: #ccc;
        }

        .log-error {
            color: #ff5555;
        }

        .log-success {
            color: #55ff55;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📺 R2T4 Admin</h1>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span id="server-status">Loading...</span>
            </div>
        </header>

        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-devices">-</div>
                <div class="stat-label">Devices</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-audio">-</div>
                <div class="stat-label">Audio Chunks</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-images">-</div>
                <div class="stat-label">Images</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-prompts">-</div>
                <div class="stat-label">Prompts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-storage">-</div>
                <div class="stat-label">Storage Used</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2>📱 Devices</h2>
                <button class="btn btn-secondary" onclick="refreshDevices()">Refresh</button>
            </div>
            <div class="device-list" id="device-list">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <div class="section" id="files-section" style="display: none;">
            <div class="section-header">
                <h2>📁 Files for <span id="selected-device"></span></h2>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-danger" onclick="clearDevice()">Clear All</button>
                    <button class="btn btn-secondary" onclick="refreshFiles()">Refresh</button>
                </div>
            </div>
            <div class="tabs">
                <button class="tab active" data-type="all" onclick="filterFiles('all', this)">All</button>
                <button class="tab" data-type="audio" onclick="filterFiles('audio', this)">Audio</button>
                <button class="tab" data-type="image" onclick="filterFiles('image', this)">Images</button>
            </div>
            <div class="file-grid" id="file-grid">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2>🔌 Plugins</h2>
                <button class="btn btn-primary" onclick="openRegisterModal()">Register Plugin</button>
            </div>

            <div class="stats-grid"
                style="margin-bottom: 24px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
                <div class="stat-card">
                    <div class="stat-value" id="stat-plugins-total">-</div>
                    <div class="stat-label">Total Plugins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-plugins-active">-</div>
                    <div class="stat-label">Active</div>
                </div>
            </div>

            <div class="device-list" id="plugin-list">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>

            <h3 style="margin-top: 24px; margin-bottom: 12px; font-size: 1rem; color: var(--text-secondary);">Recent
                Interactions</h3>
            <div class="plugin-logs" id="plugin-logs">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="file-modal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div class="modal-content" id="modal-content"></div>
    </div>

    <div class="modal" id="register-modal">
        <button class="modal-close" onclick="closeRegisterModal()">×</button>
        <div class="modal-content" style="width: 500px">
            <h2>Register Plugin</h2>
            <p style="color: var(--text-secondary); margin-bottom: 16px;">
                Enter the absolute path to the plugin executable.
                The server must have execute permissions.
            </p>
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="text" id="plugin-path" placeholder="/path/to/plugin"
                    style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary);">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn btn-secondary" onclick="closeRegisterModal()">Cancel</button>
                <button class="btn btn-primary" onclick="registerPlugin()">Register</button>
            </div>
        </div>
    </div>

    <script>
        let currentDevice = null;
        let currentFileType = 'all';

        async function fetchAPI(path) {
            const resp = await fetch(path);
            return resp.json();
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatTime(ms) {
            if (!ms) return 'Never';
            return new Date(ms).toLocaleString();
        }

        async function loadStats() {
            try {
                const data = await fetchAPI('/api/stats');
                document.getElementById('stat-devices').textContent = data.deviceCount || 0;
                document.getElementById('stat-audio').textContent = data.totalAudioChunks || 0;
                document.getElementById('stat-images').textContent = data.totalImageFrames || 0;
                document.getElementById('stat-prompts').textContent = data.totalPrompts || 0;
                document.getElementById('stat-storage').textContent = formatBytes(parseInt(data.totalStorageBytes) || 0);
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        async function loadHealth() {
            try {
                const data = await fetchAPI('/api/health');
                document.getElementById('server-status').textContent =
                    `${data.status} | v${data.version} | Up ${Math.floor(data.uptimeSeconds / 60)}m`;
            } catch (e) {
                document.getElementById('server-status').textContent = 'Disconnected';
            }
        }

        async function refreshDevices() {
            const list = document.getElementById('device-list');
            list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const data = await fetchAPI('/api/devices');
                if (!data.devices || data.devices.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <p>No devices registered yet</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = data.devices.map(d => `
                    <div class="device-card ${currentDevice === d.deviceId ? 'selected' : ''}" 
                         onclick="selectDevice('${d.deviceId}')">
                        <div class="device-info">
                            <h3>${d.deviceId}</h3>
                            <p>Last seen: ${formatTime(parseInt(d.lastSeenMs))}</p>
                        </div>
                        <div class="device-stats">
                            <span>🎤 ${d.audioChunkCount || 0}</span>
                            <span>📷 ${d.imageFrameCount || 0}</span>
                            <span>💬 ${d.promptCount || 0}</span>
                            <span>💾 ${formatBytes(parseInt(d.storageBytes) || 0)}</span>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="empty-state"><p>Failed to load devices</p></div>';
            }
        }

        function selectDevice(deviceId) {
            currentDevice = deviceId;
            document.getElementById('selected-device').textContent = deviceId;
            document.getElementById('files-section').style.display = 'block';
            refreshDevices();
            refreshFiles();
        }

        async function refreshFiles() {
            if (!currentDevice) return;

            const grid = document.getElementById('file-grid');
            grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                let type = '';
                if (currentFileType === 'audio') type = '&fileType=1';
                if (currentFileType === 'image') type = '&fileType=2';

                const data = await fetchAPI(`/api/files?deviceId=${currentDevice}${type}&limit=100`);

                if (!data.files || data.files.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><p>No files found</p></div>';
                    return;
                }

                grid.innerHTML = data.files.map(f => {
                    const isImage = f.fileType === 2;
                    const isAudio = f.fileType === 1;
                    const url = `/api/file/${currentDevice}/${f.fileId}`;

                    return `
                        <div class="file-card" onclick="openFile('${url}', ${isImage}, ${isAudio})">
                            <div class="file-preview">
                                ${isImage ? `<img src="${url}" loading="lazy" alt="">` : ''}
                                ${isAudio ? '🎤' : ''}
                            </div>
                            <div class="file-info">
                                <h4>${f.fileId.split('/').pop()}</h4>
                                <p>${formatTime(parseInt(f.timestampMs))} • ${formatBytes(parseInt(f.sizeBytes))}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                grid.innerHTML = '<div class="empty-state"><p>Failed to load files</p></div>';
            }
        }

        function filterFiles(type, btn) {
            currentFileType = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            refreshFiles();
        }

        function openFile(url, isImage, isAudio) {
            const modal = document.getElementById('file-modal');
            const content = document.getElementById('modal-content');

            if (isImage) {
                content.innerHTML = `<img src="${url}" alt="">`;
            } else if (isAudio) {
                content.innerHTML = `<audio controls src="${url}"></audio>`;
            } else {
                content.innerHTML = `<a href="${url}" download>Download</a>`;
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('file-modal').classList.remove('active');
        }

        async function clearDevice() {
            if (!currentDevice) return;
            if (!confirm(`Delete ALL data for device "${currentDevice}"?`)) return;

            try {
                await fetch(`/api/clear/${currentDevice}`, { method: 'POST' });
                refreshDevices();
                refreshFiles();
                loadStats();
            } catch (e) {
                alert('Failed to clear device');
            }
        }

        // Close modal on escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        // Initial load
        loadHealth();
        loadStats();
        refreshDevices();

        // Plugin functions
        async function refreshPlugins() {
            const list = document.getElementById('plugin-list');
            try {
                const data = await fetchAPI('/api/plugins');
                const plugins = data || []; // Endpoint returns array directly

                document.getElementById('stat-plugins-total').textContent = plugins.length;
                document.getElementById('stat-plugins-active').textContent = plugins.filter(p => p.status === 1).length;

                if (plugins.length === 0) {
                    list.innerHTML = '<div class="empty-state"><p>No plugins registered</p></div>';
                    return;
                }

                list.innerHTML = plugins.map(p => {
                    const statusClass = p.status === 2 ? 'disabled' : (p.status === 3 ? 'error' : 'active');
                    const statusText = p.status === 2 ? '(Disabled)' : (p.status === 3 ? '(Error)' : '');

                    return `
                    <div class="plugin-card ${statusClass}">
                        <div class="plugin-meta">
                            <h3>
                                ${p.name} <span style="font-weight: normal; font-size: 0.8em; color: var(--text-secondary)">v${p.version}</span>
                                ${statusText ? `<span style="font-size: 0.8em; color: var(--text-secondary)">${statusText}</span>` : ''}
                            </h3>
                            <p>${p.description || 'No description'}</p>
                            <div style="margin-top: 8px; display: flex; gap: 4px;">
                                <span class="plugin-badge">${p.path}</span>
                                ${p.capabilities && p.capabilities.map(c => `<span class="plugin-badge">${c}</span>`).join('') || ''}
                            </div>
                        </div>
                        <div class="plugin-actions">
                             <button class="btn btn-secondary" onclick="testPlugin('${p.id}')">Test</button>
                             ${p.status === 2
                            ? `<button class="btn btn-primary" onclick="togglePlugin('${p.id}', 'enable')">Enable</button>`
                            : `<button class="btn btn-secondary" onclick="togglePlugin('${p.id}', 'disable')">Disable</button>`
                        }
                             <button class="btn btn-danger" onclick="deletePlugin('${p.id}')">Delete</button>
                        </div>
                    </div>
                    `;
                }).join('');

            } catch (e) {
                console.error("Failed to load plugins", e);
                list.innerHTML = '<div class="empty-state"><p>Failed to load plugins</p></div>';
            }
        }

        async function refreshLogs() {
            const container = document.getElementById('plugin-logs');
            try {
                const data = await fetchAPI('/api/plugins/logs');
                const logs = data.logs || [];

                if (logs.length === 0) {
                    container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No logs yet</div>';
                    return;
                }

                container.innerHTML = logs.map(l => {
                    const typeColor = l.success ? 'log-success' : 'log-error';
                    return `
                    <div class="log-entry">
                        <span class="log-time">${new Date(l.timestamp).toLocaleTimeString()}</span>
                        [<span class="log-type" style="color: ${l.pluginId ? '#aaa' : '#fff'}">${l.pluginId || 'system'}</span>]
                        <span class="log-type">${l.type}</span>
                        <span class="${typeColor}">${l.success ? 'OK' : 'ERR'}</span>
                        <span style="color: #666; font-size: 0.8em;">(${l.durationMs}ms)</span>
                        <div class="log-content">${l.content}</div>
                    </div>
                    `;
                }).join('');
            } catch (e) {
                container.innerHTML = 'Failed to load logs';
            }
        }

        function openRegisterModal() {
            document.getElementById('register-modal').classList.add('active');
        }

        function closeRegisterModal() {
            document.getElementById('register-modal').classList.remove('active');
        }

        async function registerPlugin() {
            const path = document.getElementById('plugin-path').value;
            if (!path) return;

            try {
                const resp = await fetch('/api/plugins', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                });

                if (!resp.ok) {
                    const err = await resp.text();
                    alert('Failed to register: ' + err);
                    return;
                }

                closeRegisterModal();
                refreshPlugins();
                refreshLogs();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        async function togglePlugin(id, action) {
            try {
                await fetch(`/api/plugin/${id}/${action}`, { method: 'POST' });
                refreshPlugins();
                refreshLogs();
            } catch (e) {
                alert('Failed to ' + action + ' plugin');
            }
        }

        async function deletePlugin(id) {
            if (!confirm('This will unregister the plugin. Continue?')) return;
            await togglePlugin(id, 'delete');
        }

        async function testPlugin(id) {
            try {
                const resp = await fetch(`/api/plugin/${id}/test`, { method: 'POST' });
                const data = await resp.json();
                alert(data.message + (data.error ? '\n' + data.error : ''));
                refreshLogs();
            } catch (e) {
                alert('Test failed');
            }
        }

        // Refresh periodically
        setInterval(loadHealth, 30000);
        setInterval(loadStats, 60000);
        setInterval(refreshPlugins, 10000);
        setInterval(refreshLogs, 5000);

        refreshPlugins();
        refreshLogs();
    </script>
</body>

</html>
