[api.openai]
url = "https://api.openai.com/v1/chat/completions"
api_key_env = "OPENAI_API_KEY"

[api.openrouter]
url = "https://openrouter.ai/api/v1/chat/completions"
api_key_env = "OPENROUTER_API_KEY"

[api.lmstudio]
url = "http://localhost:1234/v1/chat/completions"
api_key = "lm-studio"

[api.zai]
url = "https://api.z.ai/api/paas/v4/chat/completions"
api_key_env = "ZAI_API_KEY"

[api.gemini]
url = "https://generativelanguage.googleapis.com/v1beta/chat/completions"
api_key_env = "GOOGLE_API_KEY"

[api.anthropic]
url = "https://api.anthropic.com/v1/messages"
api_key_env = "ANTHROPIC_API_KEY"

[models.qwen_scene]
id = "qwen/qwen3-4b-2507"
api = "lmstudio"
context_size = 32000
image_support = true

[models.qwen_summary]
id = "qwen/qwen3-8b"
api = "lmstudio"
context_size = 32000

[models.qwen_artifact]
id = "qwen/qwen3-30b-a3b-2507"
api = "lmstudio"
context_size = 32000

[models.openrouter_artifact]
id = "openai/gpt-4.1"
api = "openrouter"
context_size = 128000

[roles]
subtitle_summary_model = "qwen_summary"
scene_analysis_model = "qwen_scene"
artifact_model = "qwen_artifact"

[execution]
summary_gate = "start_when_ready"

[extractor]
video_path = ""
output_dir = "output"
preset = "balanced"
enable_diagnostics = true

[subtitle_ingestion]
subtitle_language = "eng"
allow_subliminal_download = true

[subtitle_summary]
recent_window_count = 3
normalized_transcript_filename = "normalized_transcript.txt"
contexts_dirname = "contexts"
summary_cache_filename = "subtitle_summaries.jsonl"
row_poll_interval_sec = 0.2
row_wait_timeout_sec = 300.0

[scene_inference]
strategy = "image_with_precomputed_subtitle_context"

[artifact]
max_validation_retries = 2

[profiles.default]

[profiles.lmstudio_fast.roles]
subtitle_summary_model = "qwen_summary"
scene_analysis_model = "qwen_scene"
artifact_model = "qwen_artifact"

[profiles.openrouter_artifact.roles]
artifact_model = "openrouter_artifact"
