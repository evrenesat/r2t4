version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/evren/r2t4/server/gen
plugins:
  # Go code generation
  - remote: buf.build/protocolbuffers/go
    out: ../server/gen
    opt: paths=source_relative
  # Connect-Go code generation
  - remote: buf.build/connectrpc/go
    out: ../server/gen
    opt: paths=source_relative
